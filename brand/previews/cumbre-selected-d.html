<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ERP Cumbre — Opcion D Refinada</title>
    <style>
      :root {
        --ink: #0f172a;
        --muted: #64748b;
        --green: #22c55e;
        --blue: #08213f;
        --border: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 0%, rgba(34, 197, 94, 0.12), transparent 26rem),
          #f8fafc;
      }

      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 52px 24px 76px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2.4rem, 6vw, 5.2rem);
        font-weight: 650;
        letter-spacing: -0.06em;
        line-height: 0.95;
      }

      p {
        max-width: 760px;
        color: var(--muted);
        line-height: 1.65;
      }

      .stage {
        display: grid;
        gap: 24px;
        margin-top: 34px;
      }

      .card {
        display: grid;
        place-items: center;
        min-height: 280px;
        padding: 34px;
        border: 1px solid var(--border);
        border-radius: 30px;
        background: #ffffff;
        box-shadow: 0 22px 70px rgba(15, 23, 42, 0.08);
      }

      .card.dark {
        background:
          radial-gradient(circle at 16% 10%, rgba(34, 197, 94, 0.22), transparent 20rem),
          linear-gradient(135deg, #0f172a, var(--blue));
      }

      .card.compact {
        min-height: 190px;
      }

      img {
        display: block;
        width: min(100%, 860px);
        height: auto;
      }

      .dark img {
        max-width: 830px;
        padding: 22px;
        border-radius: 22px;
        background: #ffffff;
      }

      .compact img {
        max-width: 520px;
      }

      .label {
        justify-self: start;
        align-self: start;
        margin-bottom: 18px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 650;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .dark .label {
        color: rgba(248, 250, 252, 0.74);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ERP Cumbre — opcion D</h1>
      <p>
        Variante refinada con familia visual GEMA: nodos, crecimiento, barras de gestion y una composicion mas centrada para el descriptor inferior.
      </p>

      <section class="stage">
        <article class="card">
          <div class="label">Fondo claro · uso principal</div>
          <img src="../logos/erp-cumbre/options/cumbre-option-d-gema-family.svg" alt="ERP Cumbre opcion D refinada" />
        </article>

        <article class="card dark">
          <div class="label">Fondo oscuro · sobre tarjeta blanca</div>
          <img src="../logos/erp-cumbre/options/cumbre-option-d-gema-family.svg" alt="ERP Cumbre opcion D refinada sobre fondo oscuro" />
        </article>

        <article class="card compact">
          <div class="label">Prueba reducida · header / tarjeta</div>
          <img src="../logos/erp-cumbre/options/cumbre-option-d-gema-family.svg" alt="ERP Cumbre opcion D refinada reducida" />
        </article>
      </section>
    </main>
  </body>
</html>
